[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpclpy"
version = "1.0.0"
description = "Python client library for building distributed node-based systems with communication, events, and knowledge management"
readme = "README.md"
license = "MIT"
authors = [
    {name = "RoboSapiens Team", email = "saharnasimi96@gmail.com"},
]
keywords = ["robotics", "distributed systems", "redis", "pub/sub", "communication", "knowledge management", "MAPE-K"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.8"
dependencies = [
    "redis>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=1.6"]
rabbitmq = ["pika>=1.3"]
kafka = ["kafka-python>=2.0"]
websocket = ["websocket-client>=1.6"]
zenoh = ["eclipse-zenoh>=0.10"]
memcached = ["python-memcached>=1.59"]
ignite = ["pyignite>=0.6"]
hazelcast = ["hazelcast-python-client>=5.0"]
tarantool = ["tarantool>=0.11"]
aerospike = ["aerospike>=8.0"]
dashboard = ["dash>=2.0", "plotly>=5.0"]
all = [
    "paho-mqtt>=1.6",
    "pika>=1.3",
    "kafka-python>=2.0",
    "websocket-client>=1.6",
    "eclipse-zenoh>=0.10",
    "python-memcached>=1.59",
    "pyignite>=0.6",
    "hazelcast-python-client>=5.0",
    "tarantool>=0.11",
    "aerospike>=8.0",
    "dash>=2.0",
    "plotly>=5.0",
]

[project.urls]
Homepage = "https://github.com/saharnn96/robosapiens-clientlibraries"
Repository = "https://github.com/saharnn96/robosapiens-clientlibraries"
Issues = "https://github.com/saharnn96/robosapiens-clientlibraries/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rpclpy*"]
