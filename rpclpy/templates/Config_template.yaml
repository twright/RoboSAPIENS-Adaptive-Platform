# ============================================================
# MAPE-K Deployment Configuration Template
# ============================================================
# Replace topic names, channels, and property classes with
# your use-case specific values.
#
# Event flow:
#   SensorData --> Monitor --> new_data --> Analysis
#   Analysis   --> anomaly  --> Plan
#   Plan       --> new_plan --> Legitimate
#   Legitimate --> isLegit  --> Execute
#   Legitimate --> anomaly  --> Plan  (re-planning loop)
# ============================================================

Monitor_Config:
  Logger_Config:
    log_level: DEBUG
    logger_type: redis
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    terminal: {}
    file:
      filename: MAPLE.log
    redis:
      host: localhost
      port: 6379
      channel: Monitor:logs
  knowledgeIn:
    properties: null
  knowledgeOut:
    properties: null
  eventIn:
    properties:
      - property:
          type: event
          name: SensorData          # TODO: replace with your incoming sensor topic
          class: "-"
          topic: /SensorData
          QoS: 10
  eventOut:
    properties:
      - property:
          type: event
          name: new_data
          class: "-"
          topic: /new_data
          QoS: 10
  Event_Manager_Config:
    protocol: redis
    host: localhost
    port: 6379
  Message_Manager_Config:
    protocol: redis
    host: localhost
    port: 6379
  Knowledge_Config:
    knowledge_type: redis
    host: localhost
    port: 6379
    db: 0

