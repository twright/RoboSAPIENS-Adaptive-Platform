      channel: Plan:logs
  knowledgeIn:
    properties: null
  knowledgeOut:
    properties:
      - property:
          type: data
          name: new_plan            # TODO: rename to your plan output type
          class: new_plan
          topic: /new_plan
          QoS: 10
  eventIn:
    properties:
      - property:
          type: event
          name: anomaly
          class: "-"
          topic: /anomaly
          QoS: 10
  eventOut:
    properties:
      - property:
          type: event
          name: new_plan
          class: "-"
          topic: /new_plan
          QoS: 10
  Event_Manager_Config:
    protocol: redis
    host: localhost
    port: 6379
  Message_Manager_Config:
    protocol: redis
    host: localhost
    port: 6379
  Knowledge_Config:
    knowledge_type: redis
    host: localhost
    port: 6379
    db: 0

