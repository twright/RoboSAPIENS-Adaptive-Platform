# Configuration for example nodes
Event_Manager_Config:
  protocol: "redis" # Using Redis for events
  host: "localhost"
  port: 6379
  db: 0

Message_Manager_Config:
  protocol: "redis" # Using Redis for messages
  host: "localhost"
  port: 6379
  db: 1

Knowledge_Config:
  knowledge_type: "redis" # Using Redis for knowledge storage
  host: "localhost"
  port: 6379
  db: 2

Logger_Config:
  log_level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "logs/"
  file_name: "node.log"
  max_file_size: 10485760 # 10MB
  backup_count: 3
