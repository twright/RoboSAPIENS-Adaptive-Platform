# --- Project -------------------------------------------------
case_name: MultiRobotNavigationAdaptation          # Output folder name; no spaces
description: "In this case there are 3 omni bas robots of PAL's fleet are navigating in a shared environment. The monitor node listens to the human detection algorithm out put conniteusely and checks the position and speed of the human, if the human approaching to the waypoin of the robot, the robot changes it's waypoinnt the change in the waypoint is happening by nav2 follow the waypoint command. So in this case the maple-k loop is responsible to check the human position and then change the wayoint of the robots to avoid the human. In monotor it stores the human position and human velocity, in analysis it checks if the human path is colliding with one of the waypoints if yes with wich one, in plan it generated new waypoint for that robot and in legitimate it checks if that path is not colliding with another robot and in execute sens the path to the robot. In simulation I want to have a dash simulator environment taht it's possibel to add the human to map and it has 3 waypoint that represents the 3 robots that are navigating accross the map. and the simulator publishes the position and velocity of the human to the monitor and subscrtibes to the new waypont from the execute node to change the waypoint of the robots."


# --- Infrastructure ------------------------------------------
infrastructure:
  protocol: redis                   # Broker: redis | mqtt | kafka | rabbitmq
  knowledge_type: redis             # Storage: redis | sqlite | memcached
  host: localhost
  port: 6379
  log_level: DEBUG                  # DEBUG | INFO | WARNING | ERROR


# --- Sensor / Input ------------------------------------------
# Defines the incoming sensor payload (the event the Monitor node subscribes to).
sensor:
  name: HumanStatus                # Class name + event key
  topic: /HumanStatus              # Redis channel / MQTT topic
  fields:
    - name: human_position
      type: str
      description: "Position of the human"
    - name: human_velocity
      type: float
      description: "Velocity of the human"


# --- Performance Monitoring (Monitor node) -------------------
monitoring:
  metric_field: human_velocity           # Which sensor field is the primary health metric
  # Python expression used to compute the score from the sensor fields above.
  # You can reference any field listed in sensor.fields by name.
  score_formula: "abs(human_velocity)"


# --- Anomaly Detection (Analysis node) -----------------------
anomaly:
  detect_window_size: 5             # Consecutive samples that must exceed threshold to flag
  threshold: 2.0                    # score/baseline ratio above which a sample is anomalous


# --- Planning (Plan node) ------------------------------------
planning:
  # New-data samples needed before retraining:
  #   data_multiplier * (2 ^ replanning_counter)
  # The exponent ensures each failed re-plan collects more data.
  data_multiplier: 50
  # Or use a fixed count instead (comment out data_multiplier above):
  # samples_needed: 200


# --- Legitimation (Legitimate node) --------------------------
legitimation:
  validate_window_size: 5           # Recent observations used to test the new plan
  valid_threshold: 4.0              # Max acceptable ratio for the new plan to be approved


# --- Action / Output -----------------------------------------
# Defines the command the Execute node publishes after a successful adaptation.
action:
  name: NewWaypoint              # Class name + event key
  topic: /NewWaypoint            # Redis channel / MQTT topic
  fields:
    - name: new_waypoint
      type: dict
      description: "new wayopoint for the robot that it's path is collides with human path"



# --- Extra Knowledge Classes (optional) ----------------------
# Add custom shared-state objects beyond the 6 built-in defaults.
extra_knowledge: []
